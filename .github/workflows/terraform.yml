name: Terraform

on:
  push:
    branches: [main]
    paths:
      - 'projects/aws/terraform-infra/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'projects/aws/terraform-infra/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (no credentials)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/aws/terraform-infra
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  plan:
    name: Plan (real AWS via OIDC)
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: projects/aws/terraform-infra
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::339494983682:role/github-actions-terraform
          aws-region: us-east-1
      - name: Who am I?
        run: aws sts get-caller-identity
      - uses: hashicorp/setup-terraform@v4
      - name: Init (real S3 backend)
        run: terraform init -input=false
      - name: Plan
        id: plan
        continue-on-error: true
        run: terraform plan -input=false -no-color
      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const plan = process.env.PLAN || "No plan output.";
            const body = "#### Terraform Plan 📋\n```\n" + plan + "\n```";
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    name: Apply (gated)
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: projects/aws/terraform-infra
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::339494983682:role/github-actions-terraform
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v4
      - name: Init (real S3 backend)
        run: terraform init -input=false
      - name: Apply
        run: terraform apply -auto-approve -input=false
